<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Micro·poemas bolivianos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Columna única centrada. Fondo blanco, texto negro, acento cálido (eco del bus)
     solo en palabras subrayadas y tooltip. Mono de máquina de escribir. */
  :root{
    --bg:#ffffff; --ink:#111111; --line:#e4e4e4; --muted:#666666; --accent:#c0531d;
    --tip-bg:#141414; --tip-fg:#ffffff; color-scheme:light;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Courier New","Courier",ui-monospace,monospace; font-size:15px; line-height:1.5;
    display:flex; flex-direction:column; align-items:center;
    padding-left:max(16px,env(safe-area-inset-left,0px));
    padding-right:max(16px,env(safe-area-inset-right,0px));
    padding-block:0;
  }
  button{font-family:inherit}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .wrap{width:100%;max-width:680px;display:flex;flex-direction:column;align-items:center;
    text-align:center;padding-block:28px;gap:18px}

  header{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px;
    border-bottom:1px solid var(--line);padding-bottom:16px}
  header .title{font-weight:700;letter-spacing:.02em;font-size:18px}
  header nav{display:flex;gap:18px;font-size:12px}
  header nav button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;text-decoration:underline;padding:0}
  header nav button:hover{color:var(--ink)}

  .bus{display:block;width:100%;max-width:440px;height:auto}

  .hint{font-size:12px;color:var(--muted);line-height:1.6;max-width:46ch}
  .note{font-size:12px;line-height:1.55;color:var(--ink);border:1px solid var(--line);
    border-top:3px solid var(--accent);padding:10px 14px;background:#faf7f5;max-width:46ch}

  .controls{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}
  .counter{display:flex;align-items:center;gap:10px}
  .counter label{font-size:12px;color:var(--muted)}
  .counter button{width:28px;height:28px;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;font-size:16px;line-height:1}
  .counter button:hover{background:var(--ink);color:var(--bg)}
  .counter .num{min-width:22px;text-align:center;font-size:16px;font-variant-numeric:tabular-nums}

  .generate{border:1px solid var(--ink);background:var(--ink);color:var(--bg);font-size:14px;letter-spacing:.06em;padding:11px 20px;cursor:pointer}
  .generate:hover{background:transparent;color:var(--ink)}
  .copy{border:1px solid var(--ink);background:none;color:var(--ink);font-size:13px;padding:11px 16px;cursor:pointer}
  .copy:hover{background:var(--ink);color:var(--bg)}

  .catcount{font-size:11px;color:var(--muted)}

  .poem{font-size:clamp(20px,4vw,32px);line-height:1.55;max-width:24ch;margin-top:6px;text-wrap:balance}
  .poem .v{display:block;opacity:0;transform:translateY(6px);animation:rise .5s forwards}
  @keyframes rise{to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){.poem .v{animation:none;opacity:1;transform:none}}
  .poem .w{border-bottom:1px solid var(--accent);cursor:help}
  .poem .w:hover{color:var(--accent)}

  .meta{font-size:11px;color:var(--muted);max-width:46ch;line-height:1.7}

  .tip{position:fixed;background:var(--tip-bg);color:var(--tip-fg);font-size:12px;padding:8px 11px;max-width:250px;line-height:1.45;pointer-events:none;z-index:50;opacity:0;transition:opacity .12s;text-align:left}
  .tip.show{opacity:1}
  .tip .o{color:#e39b6a;font-style:italic}

  .overlay{position:fixed;inset:0;background:var(--bg);z-index:60;padding-block:48px;
    padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));overflow:auto}
  .overlay[hidden]{display:none}
  .overlay .box{max-width:620px;margin:0 auto;text-align:left}
  .overlay h2{font-size:18px;margin:0 0 16px;border-bottom:1px solid var(--line);padding-bottom:8px}
  .overlay p{margin:0 0 14px;line-height:1.75;font-size:14px}
  .overlay .close{position:fixed;top:14px;right:max(16px,env(safe-area-inset-right,0px));background:none;border:none;color:var(--ink);font-size:24px;cursor:pointer;line-height:1}
</style>
</head>

    {m:"siútico",f:"siútica",def:"que presume de fino y elegante",or:""},
    {m:"temperado",f:"temperada",def:"templado, de temperatura suave",or:""},
    {m:"varado",f:"varada",def:"sin recursos económicos",or:""},
    {m:"tierno",f:"tierna",def:"dicho de un fruto: verde, que aún no está maduro",or:""},
    {m:"santulón",f:"santulona",def:"santurrón, exagerado en la devoción",or:""},
    {m:"veintiúnico",f:"veintiúnica",def:"solo en su especie, único",or:""},
    {m:"macanudo",f:"macanuda",def:"extraordinario, excelente",or:""},
  ],
  interjecciones: [
    {w:"¡achalay!",def:"para expresar agrado o admiración",or:"quechua"},
    {w:"¡alalay!",def:"para denotar sensación de frío",or:""},
    {w:"¡amalaya!",def:"para expresar deseo o lamentación",or:""},
    {w:"¡ananay!",def:"para manifestar que algo es grato a la vista",or:"quechua"},
    {w:"¡atatay!",def:"para denotar dolor",or:"quechua"},
    {w:"¡aro!",def:"para suspender el baile y brindar",or:""},
    {w:"¡che!",def:"para llamar o pedir atención",or:""},
    {w:"¡epa!",def:"para animar o avisar de un peligro",or:""},
    {w:"¡gua!",def:"para expresar temor o admiración",or:""},
    {w:"¡cancha!",def:"para pedir que abran paso",or:""},
    {w:"¡chau!",def:"adiós",or:""},
  ],
};

</script>
<script>
(function(){
  const $=s=>document.querySelector(s);
  const rand=a=>a[Math.floor(Math.random()*a.length)];
  const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
  const norm=s=>s.toLowerCase().replace(/[¡!]/g,'');

  function plAdj(w){
    if(/ón$/.test(w)) return w.replace(/ón$/,"ones");
    if(/án$/.test(w)) return w.replace(/án$/,"anes");
    if(/ín$/.test(w)) return w.replace(/ín$/,"ines");
    if(/ún$/.test(w)) return w.replace(/ún$/,"unes");
    if(/[aeiouáéíóú]$/i.test(w)) return w+"s";
    return w+"es";
  }
  function plVerb(t3){ return t3+"n"; }

  $("#catcount").textContent =
    DATA.sustantivos.length+" sust · "+DATA.verbos.length+" verb · "+
    DATA.adjetivos.length+" adj · "+DATA.interjecciones.length+" interj — diccionario de bolivianismos (A–Z)";

  const PLANTILLAS = [
    "{I}, {el1} {S1} {A1}.",
    "{el1} {S1} {V} despacio.",
    "{un1} {S1} {A1} {V} en la neblina.",
    "{V} {el1} {S1}, dicen los que saben.",
    "{I} — y otra vez {el1} {S1}.",
    "donde {V} {el1} {S1} {A1}, nadie vuelve.",
    "{el1} {S1} {A1}, bajo la helada.",
    "{los1} {Sp1} {Ap1} {Vp} sin descanso.",
    "ni {S1} ni sombra: apenas {I}",
    "{el1} {S1} {A1} y {el2} {S2} {A2}.",
    "{el1} {S1} {V} y {V}.",
    "{V} {el1} {S1} en la pampa.",
    "{I}: {los1} {Sp1} ya no {Vp}.",
    "{un1} {S1} {A1}, nada más.",
    "{el1} {S1} {V} como {el2} {S2}.",
  ];

  const ANIM = DATA.sustantivos.filter(o=>o.anim);
  const pickVerb=()=>rand(DATA.verbos);
  const pickAdj=()=>rand(DATA.adjetivos);
  const pickInterj=()=>rand(DATA.interjecciones);
  const pickSubject=()=>rand(ANIM.length?ANIM:DATA.sustantivos);
  const pickNoun=()=>rand(DATA.sustantivos);

  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function wspan(surface,def,or){
    return '<span class="w" data-def="'+esc(def||'')+'" data-or="'+esc(or||'')+'" data-t="'+esc(surface)+'">'+esc(surface)+'</span>';
  }

  function buildVerse(tpl){
    const hasVerb = /\{Vp?\}/.test(tpl);
    const nouns={};
    (tpl.match(/\{(?:el|un|los|S|Sp|A|Ap)(\d)\}/g)||[]).forEach(tok=>{
      const idx=tok.match(/(\d)\}/)[1];
      if(!nouns[idx]) nouns[idx] = (idx==="1"&&hasVerb) ? pickSubject() : pickNoun();
    });
    let out=tpl;
    out=out.replace(/\{el(\d)\}/g,(m,i)=>nouns[i].g==="f"?"la":"el");
    out=out.replace(/\{un(\d)\}/g,(m,i)=>nouns[i].g==="f"?"una":"un");
    out=out.replace(/\{los(\d)\}/g,(m,i)=>nouns[i].g==="f"?"las":"los");
    out=out.replace(/\{Sp(\d)\}/g,(m,i)=>{const o=nouns[i];return wspan(o.pl,o.def,o.or);});
    out=out.replace(/\{S(\d)\}/g,(m,i)=>{const o=nouns[i];return wspan(o.w,o.def,o.or);});
    out=out.replace(/\{Ap(\d)\}/g,(m,i)=>{const a=pickAdj();const base=nouns[i].g==="f"?a.f:a.m;return wspan(plAdj(base),a.def,a.or);});
    out=out.replace(/\{A(\d)\}/g,(m,i)=>{const a=pickAdj();const base=nouns[i].g==="f"?a.f:a.m;return wspan(base,a.def,a.or);});
    out=out.replace(/\{Vp\}/g,()=>{const o=pickVerb();return wspan(plVerb(o.t3),o.def,o.or);});
    out=out.replace(/\{V\}/g,()=>{const o=pickVerb();return wspan(o.t3,o.def,o.or);});
    out=out.replace(/\{Av\}/g,()=>{const a=pickAdj();return wspan(a.m,a.def,a.or);});
    out=out.replace(/\{I\}/g,()=>{const o=pickInterj();return wspan(o.w,o.def,o.or);});
    return out;
  }

  let nVerses=4;
  $("#inc").onclick=()=>{nVerses=Math.min(8,nVerses+1);$("#num").textContent=nVerses;};
  $("#dec").onclick=()=>{nVerses=Math.max(1,nVerses-1);$("#num").textContent=nVerses;};

  let lastText="";
  function generate(){
    const poem=$("#poem"); poem.innerHTML="";
    const plain=[]; let last=-1;
    for(let i=0;i<nVerses;i++){
      let idx;do{idx=Math.floor(Math.random()*PLANTILLAS.length);}while(idx===last&&PLANTILLAS.length>1);
      last=idx;
      const html=cap(buildVerse(PLANTILLAS[idx]));
      const v=document.createElement("span");
      v.className="v"; v.style.animationDelay=(i*0.08)+"s"; v.innerHTML=html;
      poem.appendChild(v); plain.push(v.textContent);
    }
    lastText=plain.join("\n");
    $("#metaline").textContent="poema generado al azar con bolivianismos reales — en construcción, puede haber versos con errores · pasá el cursor (o tocá) una palabra subrayada para ver su significado";
    attachTips();
  }

  const tip=$("#tip");
  function showTipFor(el,e){
    let def=el.getAttribute("data-def"), or=el.getAttribute("data-or"), t=el.getAttribute("data-t");
    if(!def){ tip.classList.remove("show"); return; }
    tip.innerHTML="<b>"+esc(t)+"</b>"+(or?' <span class="o">['+esc(or)+']</span>':'')+"<br>"+esc(def);
    tip.classList.add("show"); moveTip(e);
  }
  function attachTips(){
    document.querySelectorAll(".poem .w").forEach(el=>{
      el.addEventListener("mouseenter",e=>showTipFor(el,e));
      el.addEventListener("mousemove",moveTip);
      el.addEventListener("mouseleave",()=>tip.classList.remove("show"));
      el.addEventListener("click",e=>{showTipFor(el,e);e.stopPropagation();});
    });
  }
  function moveTip(e){
    const px=e.clientX!=null?e.clientX:innerWidth/2, py=e.clientY!=null?e.clientY:80;
    let x=px+14,y=py+14; if(x+260>innerWidth)x=px-264; if(x<8)x=8;
    tip.style.left=x+"px"; tip.style.top=y+"px";
  }
  document.addEventListener("click",()=>tip.classList.remove("show"));

  $("#gen").onclick=generate;
  $("#copybtn").onclick=()=>{
    if(!lastText) return;
    const btn=$("#copybtn");
    navigator.clipboard?.writeText(lastText).then(()=>{
      btn.textContent="copiado ✓"; setTimeout(()=>btn.textContent="copiar",1400);
    }).catch(()=>{
      const r=document.createRange(); r.selectNodeContents($("#poem"));
      const s=getSelection(); s.removeAllRanges(); s.addRange(r);
      btn.textContent="Ctrl+C"; setTimeout(()=>btn.textContent="copiar",1600);
    });
  };

  const overlay=$("#overlay"), ovBody=$("#ov-body");
  function showOverlay(h){ovBody.innerHTML=h;overlay.hidden=false;}
  $("#ov-close").onclick=()=>overlay.hidden=true;
  overlay.addEventListener("click",e=>{if(e.target===overlay)overlay.hidden=true;});
  document.addEventListener("keydown",e=>{if(e.key==="Escape")overlay.hidden=true;});

  $("#nav-concept").onclick=()=>showOverlay(
    '<h2>concepto</h2>'+
    '<p>El habla boliviana incorpora un conjunto de palabras y expresiones propias que no forman parte del uso habitual del castellano de España. Muchas de ellas proceden de lenguas indígenas como el quechua, el aymara, el guaraní y el mapuche, mientras que otras están vinculadas a contextos específicos de la vida social y cultural del país, como la actividad minera, el altiplano, las festividades y la gastronomía, entre otros.</p>'+
    '<p>Este generador toma bolivianismos <b>reales</b> registrados en el <i>Diccionario de la lengua española</i> con la marca <b>Bol.</b> y los combina al azar para armar un micro-poema distinto en cada clic. El programa cuida la gramática (concordancia de género y número), pero no entiende el significado de las palabras, solo las encaja, por lo que algunos textos pueden tener más sentido que otros.</p>'+
    '<p>Por eso, <b>es un proyecto en construcción</b>, a veces los versos encajan de forma preciosa y a veces resultan extraños o con errores. Esa mezcla entre acierto y azar es parte del juego.</p>'
  );
  $("#nav-source").onclick=()=>showOverlay(
    '<h2>fuente</h2>'+
    '<p>Las palabras y sus definiciones provienen de:</p>'+
    '<p><b>Bolivianismos en el Diccionario de la lengua española</b>, 23.ª ed. (2014). Recopilación de <b>Raúl Rivadeneira Prada</b> — 1551 lemas con la marca <i>Bol.</i></p>'+
    '<p>Esta versión usa una selección de <b>todo el diccionario (A–Z)</b>: '+(DATA.sustantivos.length+DATA.verbos.length+DATA.adjetivos.length+DATA.interjecciones.length)+' palabras. Las definiciones están abreviadas; la marca entre corchetes indica el origen de la voz (quechua, aimara, guaraní, etc.).</p>'
  );

  generate();
})();
</script>

</body>
</html>
